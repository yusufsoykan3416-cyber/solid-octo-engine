name: Build Minecraft Plugin

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'
      - '*.zip'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Extract project
        run: |
          mkdir extracted
          unzip -o *.zip -d extracted
          find extracted -type f -name build.gradle

      - name: Build plugin
        run: |
          cd "$(dirname "$(find extracted -type f -name build.gradle | head -n 1)")"
          gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: YeteneklerPlugin-JAR
          path: extracted/**/build/libs/*.jar
